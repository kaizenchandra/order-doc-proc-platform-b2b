{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "order.name" . }}
  labels:
    {{- include "order.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "order.selector" . | nindent 6 }}
  policyTypes: [ Ingress, Egress ]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
  egress:
    # DNS: cluster DNS pods and node-local cache. Verify the cache CIDR for your cluster.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock: { cidr: {{ .Values.networkPolicy.nodeLocalDnsCidr | quote }} }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Autopilot uses Dataplane V2; both documented metadata server ports are allowed.
    - to:
        - ipBlock: { cidr: 169.254.169.254/32 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 8080 }
    # Cloud SQL Java connector uses 3307, not PostgreSQL's direct 5432 port.
    - to:
        {{- range .Values.networkPolicy.sqlCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 3307 }
    # Google APIs and the external identity provider. Standard NetworkPolicy cannot filter FQDNs.
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
  {{- end }}
