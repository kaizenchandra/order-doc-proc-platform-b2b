# Reference contract for Phase 13 Terraform; replace ALL uppercase placeholders.
# Do not apply alongside Terraform ownership. IAM/subscriptions are separate resources.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: document-service
  annotations:
    run.googleapis.com/ingress: internal
    run.googleapis.com/invoker-iam-disabled: 'false'
    run.googleapis.com/custom-audiences: '["https://order-platform.example.invalid/document-push"]'
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '4'
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: 'true'
        run.googleapis.com/startup-cpu-boost: 'true'
    spec:
      serviceAccountName: document-runtime@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 2
      timeoutSeconds: 180
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/platform/document-service@sha256:IMAGE_DIGEST
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "cloud-run"
            - name: PUSH_AUDIENCE
              value: "https://order-platform.example.invalid/document-push"
            - name: PUSH_SERVICE_ACCOUNT_EMAIL
              value: "document-push@PROJECT_ID.iam.gserviceaccount.com"
            - name: STORAGE_ENABLED
              value: "true"
            - name: MESSAGING_ENABLED
              value: "true"
            - name: PUBSUB_PROJECT_ID
              value: "PROJECT_ID"
            - name: PUBSUB_EMULATOR_HOST
              value: ""
            - name: UPLOAD_BUCKET
              value: "PROJECT_ID-uploads"
            - name: REPORT_BUCKET
              value: "PROJECT_ID-reports"
            - name: DOCUMENT_RESULTS_TOPIC
              value: "document-results"
            - name: DOCUMENT_REQUESTS_SUBSCRIPTION
              value: "projects/PROJECT_ID/subscriptions/document-requests"
  traffic:
    - latestRevision: true
      percent: 100
