spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    # No embedded database or local credentials as a production fallback.
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 0
      connection-timeout: 3000
      validation-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    # Production will run migrations with a separate deployment identity.
    enabled: ${DB_MIGRATIONS_ENABLED:true}
    clean-disabled: true
    validate-on-migrate: true
  sql:
    init:
      mode: never

app:
  security:
    issuer: ${AUTH_ISSUER:}
    jwk-set-uri: ${AUTH_JWK_SET_URI:}
    audience: ${AUTH_AUDIENCE:}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    upload-bucket: ${UPLOAD_BUCKET:}
    report-bucket: ${REPORT_BUCKET:}
    signing-service-account: ${GCS_SIGNING_SERVICE_ACCOUNT:}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
    project-id: ${PUBSUB_PROJECT_ID:}
    emulator-host: ${PUBSUB_EMULATOR_HOST:}
    order-events-topic: ${ORDER_EVENTS_TOPIC:order-events}
    requests-topic: ${DOCUMENT_REQUESTS_TOPIC:document-requests}
    results-subscription: ${ORDER_RESULTS_SUBSCRIPTION:order-document-results}
    report-bucket: ${REPORT_BUCKET:}

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,messaging

logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        level: severity
      add:
        service: ${spring.application.name}
