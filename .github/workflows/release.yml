name: Publish verified images
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      JAVA_IMAGE: ${{ vars.JAVA_IMAGE }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: service-jars
          path: services
      - name: Build immutable-base release candidates
        run: python3 scripts/ci/release.py build
      - name: Scan order image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: local/order-service:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 10m
      - name: Scan document image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: local/document-service:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 10m
      - name: Scan notification image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          version: v0.69.3
          image-ref: local/notification-service:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          timeout: 10m
      - name: Generate release SBOMs
        run: |
          mkdir -p target/release
          for service in order document notification; do
            trivy image --format cyclonedx --output "target/release/$service.cdx.json" "local/$service-service:$GITHUB_SHA"
          done
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PUBLISH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '548.0.0'
      - name: Publish scanned images and record registry digests
        run: python3 scripts/ci/release.py publish
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest
          path: target/release/
          if-no-files-found: error
          retention-days: 90
