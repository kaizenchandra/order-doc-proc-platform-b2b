name: Review and deploy release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [dev, staging, prod]
        required: true
      release_run_id:
        description: Successful main-branch publish workflow run ID
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}-plan
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      REGISTRY: ${{ vars.RELEASE_REGISTRY }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      TFVARS_JSON: ${{ vars.TFVARS_JSON }}
      HELM_VALUES_JSON: ${{ vars.HELM_VALUES_JSON }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify release run provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/deployment.py provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-manifest
          path: target/release
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
      - name: Validate release and write non-secret deployment inputs
        run: python3 scripts/ci/deployment.py prepare
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.PLAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '548.0.0'
      - name: Produce saved plan and Helm preview
        run: ./scripts/ci/plan.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-plan
          path: |
            target/deployment/manifest.json
            target/deployment/plan.sha256
            target/deployment/changes.json
            target/deployment/platform-values.yaml
            target/deployment/helm-values.json
            target/deployment/helm-preview.yaml
          if-no-files-found: error
          retention-days: 1
  apply:
    needs: plan
    runs-on: [self-hosted, linux, x64, 'order-platform-${{ inputs.environment }}']
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-plan
          path: target/deployment
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.APPLY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '548.0.0'
          install_components: gke-gcloud-auth-plugin
      - name: Apply reviewed plan and roll out Helm release
        run: ./scripts/ci/apply.sh
      - name: Remove local deployment and credential artifacts
        if: always()
        run: rm -rf target/deployment
